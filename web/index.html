<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档转 PPT</title>
<!-- 内联一个方块图标：省一次请求，也免得 favicon.ico 报 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23D31245'/%3E%3Ctext x='16' y='23' font-family='Segoe UI,sans-serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app-shell">

  <!-- ── 左侧栏：品牌 / 新建 / 状态 / 进度 ─────────────────── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div>
        <h1>文档转 PPT</h1>
        <p>迈胜模板 · AI Presentation Builder</p>
      </div>
    </div>

    <button id="newBtn" class="primary full">新建 PPT</button>

    <div id="statusBar" class="status sidebar-status">等待输入</div>

    <section id="progressPanel" class="progress-panel sidebar-progress hidden">
      <div class="progress-head">
        <strong>制作进度</strong>
        <span>实时刷新</span>
      </div>
      <div id="progressList" class="progress-list"></div>
    </section>

    <!-- 左下角原来有一块「文本模型 / 视觉模型 / 页数 · 渲染 officecli」的配置小字。
         它属于排查信息而不是使用信息（换个模型、officecli 有没有装好，都是部署时
         一次说清的事），要看就 `run.py config`。 -->
  </aside>

  <!-- ── 主区 ──────────────────────────────────────────────── -->
  <main class="main">
    <div class="page-head">
      <div>
        <h2>生成公司模板 PPT</h2>
        <p>上传 Word / PDF / 文本，或选用项目里已有的文档 —— 先确认大纲，再生成可下载的 pptx。</p>
      </div>
    </div>

    <!-- 选源 -->
    <section class="composer">
      <div class="source-panel">

        <div class="source-line">
          <label class="source-radio">
            <input type="radio" name="sourceMode" value="upload" checked> 上传文件
          </label>
          <div class="upload-area" id="dropZone">
            <input id="files" type="file" multiple hidden>
            <div class="drop-hint">
              把文件拖到这里，或
              <button type="button" id="browseBtn" class="link">选择文件</button>
              <span id="acceptHint" class="muted"></span>
            </div>
            <div id="fileList" class="file-list"></div>
          </div>
        </div>

        <div class="source-line">
          <label class="source-radio">
            <input type="radio" name="sourceMode" value="existing"> 选择已有文档
          </label>
          <select id="src" disabled></select>
        </div>

        <div class="source-line action-line">
          <div class="action-settings">
            <label class="detail-control">输出文件名
              <input id="deckName" type="text" value="mydeck">
            </label>
            <!-- 修复轮数不在这里：它由 `.env` 的 PPTGEN_REPAIR_ROUNDS 定死
                 （`config.repair_rounds()`），一次流程该修几轮属于部署口径。 -->
            <!-- 默认值由 /api/config 回填（`.env` 的 PPTGEN_CONTENT_MODE）。
                 `value` 是内部口径名（`config.CONTENT_MODES`），文案是给人看的
                 说法 —— 与 README / `docs/程序运行文档.md` 那张表一一对应。 -->
            <label class="detail-control">内容策略
              <select id="contentMode"
                title="模型对原文的取舍口径：严格参照文档 / 适当扩展内容 / 大量拓展内容。改动从下一次「生成大纲」开始生效（已生成的大纲不会被改写）。">
                <option value="strict">严格参照文档</option>
                <option value="balance">适当扩展内容</option>
                <option value="enrich">大量拓展内容</option>
              </select>
            </label>
          </div>
          <button id="btnOutline" class="primary">生成大纲</button>
        </div>

      </div>
    </section>

    <!-- 大纲确认 -->
    <section class="panel" id="outlinePanel">
      <div class="panel-title">
        <h3>大纲确认</h3>
        <span id="outlineMeta" class="meta"></span>
      </div>
      <p class="hint" id="outlineHint">
        这是<strong>人工确认的落点</strong> —— 章节名和页标题都可以直接在下面改，改完再生成。
      </p>
      <div id="outlineWarn" class="outline-warn" hidden></div>
      <div id="outlineEditor" class="outline"></div>
      <details class="advanced-editor">
        <summary>高级：直接编辑 JSON</summary>
        <textarea id="outlineJson" class="json-editor" spellcheck="false"></textarea>
      </details>
      <div class="panel-actions">
        <button id="btnGenerate" class="primary" disabled>生成 PPT</button>
      </div>
    </section>

    <!-- 日志 -->
    <section class="panel" id="logPanel">
      <div class="panel-title">
        <h3>生成日志</h3>
        <span id="jobState" class="meta"></span>
      </div>
      <pre id="log" class="log empty">（还没有任务）</pre>
    </section>

    <!-- 结果 -->
    <section class="panel" id="resultPanel">
      <div class="panel-title">
        <h3>生成结果</h3>
        <span id="qaBadge" class="meta"></span>
      </div>
      <div id="downloadArea" class="download-area empty">生成完成后，这里会出现下载链接与逐页预览。</div>
      <div id="previewGrid" class="preview-grid"></div>

      <!-- 按页提修改意见：一个输入框说多个页面要改什么，两种模式 -->
      <div id="revisePanel" class="revise-panel hidden">
        <div class="panel-title">
          <h3>按页修改</h3>
          <span class="meta">对着上面的预览图说第几页要改什么 —— 一个框里可以写多条</span>
        </div>
        <div class="revise-modes">
          <label class="mode-radio">
            <input type="radio" name="reviseMode" value="patch" checked>
            <strong>小范围修改</strong>
            <small>只改文字，版式不变（快、可预期）</small>
          </label>
          <label class="mode-radio">
            <input type="radio" name="reviseMode" value="rewrite">
            <strong>整页重做</strong>
            <small>这一页重讲，可以换版式；封面/目录则重出这两页的文案（慢）</small>
          </label>
        </div>
        <textarea id="reviseText" class="revise-input" spellcheck="false"
          placeholder="例：第 5 页标题太长了，压到 10 字以内；第 7 页那条说明改短些"></textarea>
        <div class="revise-actions">
          <button type="button" id="btnQuote" class="secondary">引用选中的页</button>
          <span id="pickedHint" class="meta"></span>
          <button type="button" id="btnRevise" class="primary">生成修改方案</button>
        </div>
      </div>

      <!-- 修改方案：逐条 diff，确认后才应用 -->
      <div id="diffPanel" class="panel hidden">
        <div class="panel-title">
          <h3>修改方案</h3>
          <span id="diffMeta" class="meta"></span>
        </div>
        <div id="diffList" class="diff-list"></div>
        <div class="panel-actions">
          <button type="button" id="btnDiscard" class="secondary">全部丢弃</button>
          <button type="button" id="btnApply" class="primary">应用选中的修改</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- 预览弹层。放在 .app-shell 外面：它是 position:fixed 的整屏覆盖层，
     落进那个 grid 里没有好处，只多一层布局上下文要操心。 -->
<div id="lightbox" class="lightbox hidden">
  <img id="lbImg" alt="">
  <div class="lb-bar">
    <button type="button" id="lbPrev" class="lb-nav" title="上一页（←）">‹</button>
    <span id="lbPage" class="lb-page"></span>
    <button type="button" id="lbNext" class="lb-nav" title="下一页（→）">›</button>
    <button type="button" id="lbToggle" class="lb-toggle hidden">改动前</button>
  </div>
  <button type="button" id="lbClose" class="lb-close" title="关闭（Esc）">✕</button>
</div>

<script src="/static/app.js"></script>
</body>
</html>
